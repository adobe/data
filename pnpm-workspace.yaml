allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false
overrides:
  # The tools both this workspace and ecs/'s build with, pinned alike in both, so each builds and tests with what the
  # other does; scripts/check-workspace-conventions.mjs checks they agree, and that both lockfiles resolve them alike.
  typescript: 5.9.3
  '@webgpu/types': 0.1.74
  '@types/node@^25': 25.9.9
  'vitest@^5': 5.1.0
  '@vitest/browser-playwright@^5': 5.1.0
  'vite@^8': 8.3.8
  playwright: 1.65.1

  '@oxc-parser/binding-wasm32-wasip1>@napi-rs/wasm-runtime': 1.2.5
  '@oxc-transform/binding-wasm32-wasip1>@napi-rs/wasm-runtime': 1.2.5
